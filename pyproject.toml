[project]
name = "private-research-lab"
version = "0.1.0"
description = "Offline-first, reasoning-aware cybersecurity and ICS learning lab"
requires-python = ">=3.12"
dependencies = ["flask==3.1.3", "gunicorn==23.0.0"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
